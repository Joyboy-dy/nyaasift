# nyaasift : déploiement du site privé, à partir des images publiées.
#
#   cp .env.production.example .env.prod   # puis remplir les secrets
#   docker compose -f deploy/compose.yaml --env-file .env.prod up -d   # depuis la racine du dépôt
#
# IMAGE_PREFIX nomme les images, par ex. ghcr.io/<propriétaire>/nyaasift (voir .github/workflows/release.yml).
# Le site n'est publié que sur 127.0.0.1 : mettre un proxy TLS devant (Caddy, Traefik, Dokploy…).
# La base SQLite vit dans le volume « data » : c'est lui qu'il faut sauvegarder.
name: nyaasift

services:
  web:
    image: ${IMAGE_PREFIX:?Définir IMAGE_PREFIX, par ex. ghcr.io/owner/nyaasift}-web:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Définir APP_URL, l'adresse publique, par ex. https://exemple.fr}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définir BETTER_AUTH_SECRET (32 caractères au moins)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${APP_URL}}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Définir SUPER_ADMIN_EMAIL}
    volumes:
      - data:/app/data
    ports:
      # Lié à localhost : le proxy y accède, pas le reste d'Internet.
      - "${BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

volumes:
  data:
