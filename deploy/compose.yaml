# nyaasift — production deployment, from the published images.
#
#   cp .env.production.example .env.prod   # then fill in the secrets
#   docker compose -f deploy/compose.yaml --env-file .env.prod up -d   # from the repo root
#
# IMAGE_PREFIX names the images, e.g. ghcr.io/<owner>/nyaasift (see .github/workflows/release.yml).
# Only the web app is published on the host, bound to 127.0.0.1: put a TLS reverse proxy
# (Caddy, Traefik, Dokploy…) in front of it. The API and the database stay internal.
name: nyaasift

x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?Set APP_URL to the public address, e.g. https://example.com}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}

services:
  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX, e.g. ghcr.io/owner/nyaasift}-web:${VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set APP_URL to the public address, e.g. https://example.com}
    ports:
      # Bound to localhost: the reverse proxy reaches it, the outside world does not.
      - "${BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
