# nyaasift : déploiement du site privé sur un serveur, construit depuis les sources (aucun registre).
#
# Dokploy : service « Compose », chemin deploy/compose.yaml, variables de deploy/.env.prod
# dans l'onglet Environment, domaine sur le service web, port 3000 (voir deploy/DEPLOY.md).
# Ailleurs : docker compose -f deploy/compose.yaml --env-file deploy/.env.prod up -d --build
#
# Pas de port publié : le proxy (Traefik de Dokploy) joint le conteneur par le réseau Docker.
# La base SQLite vit dans le volume « data » : c'est lui qu'il faut sauvegarder.
name: nyaasift

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Définir APP_URL, l'adresse publique, par ex. https://exemple.fr}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définir BETTER_AUTH_SECRET (32 caractères au moins)}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Définir SUPER_ADMIN_EMAIL}
      CHROME_EXTENSION_URL: ${CHROME_EXTENSION_URL:-}
    expose:
      - "3000"
    volumes:
      - data:/app/data

volumes:
  data:
